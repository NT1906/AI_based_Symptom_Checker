name: Bug report
description: Something is broken on develop or main.
title: "[Bug] <short description>"
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
    validations: { required: true }
  - type: input
    id: area
    attributes:
      label: Module / owner
      description: e.g. server/src/services/prediction (nisarg)
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Remove any personal or health data first.
      render: text
