# Dependabot keeps dependencies patched. PRs target `develop` and are reviewed like any other PR.
# Rutva: uncomment the npm / pip blocks in Sprint 0 once client/, server/ and ai/ exist.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    open-pull-requests-limit: 3

