# Continuous integration for every PR. Pushes to develop/main run it through cd.yml (workflow_call)
# so nothing deploys unless CI passes. Required status check: "CI passed" (aggregates all jobs).
# Module jobs switch on automatically once client/, server/ or ml/ exist, so CI works from day one.
name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect modules
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.d.outputs.client }}
      server: ${{ steps.d.outputs.server }}
      ml: ${{ steps.d.outputs.ml }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          echo "client=$([ -f client/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "server=$([ -f server/requirements.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ml=$([ -d ml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  hygiene:
    name: Repo hygiene & docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No secrets, .env files, node_modules or large files
        run: bash .github/scripts/check-hygiene.sh
      - name: Changed source files have a header comment
        if: github.event_name == 'pull_request'
        run: node .github/scripts/check-file-headers.js "origin/${{ github.base_ref }}"

  server:
    name: Server (ruff, mypy, pytest, docker build)
    needs: detect
    if: needs.detect.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: symptom_checker_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://test_user:test_pass@localhost:5432/symptom_checker_test
      JWT_SECRET: ci-test-secret-that-is-at-least-32-characters
      AI_PROVIDER: mock
      CV_PROVIDER: mock
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - name: Apply database migrations
        run: |
          if [ -f alembic.ini ]; then alembic upgrade head; fi
      - run: pytest
      - name: Docker image builds (what Render will deploy)
        run: |
          if [ -f Dockerfile ]; then docker build -t symptom-checker-api:ci .; fi

  client:
    name: Client (lint, typecheck, test, build)
    needs: detect
    if: needs.detect.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build is a valid PWA (manifest + service worker)
        run: |
          test -f dist/manifest.webmanifest || { echo "::error::dist/manifest.webmanifest missing (vite-plugin-pwa)"; exit 1; }
          test -f dist/sw.js || { echo "::error::dist/sw.js missing (vite-plugin-pwa)"; exit 1; }

  ml:
    name: ML code (ruff, light pytest)
    needs: detect
    if: needs.detect.outputs.ml == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install ruff pytest
      - run: ruff check .
      # Training deps (torch etc.) are too heavy for CI; tests use requirements-ci.txt only.
      - name: pytest (exit code 5 = no tests collected yet)
        run: |
          if [ -f requirements-ci.txt ]; then pip install -r requirements-ci.txt; fi
          pytest -q || [ $? -eq 5 ]

  ci-passed:
    name: CI passed
    if: always()
    needs: [detect, hygiene, server, client, ml]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more CI jobs failed."; exit 1
          fi
